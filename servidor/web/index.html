<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CYD</title>
<style>
  :root {
    --bg: #0e1015; --card: #171a21; --line: #2a2f3a; --text: #e8eaee; --muted: #8b93a1;
    --accent: #ff8c28; --good: #50c878; --warn: #f0be3c; --bad: #eb5046; --blue: #64a5ff;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 24px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .wide { grid-column: 1 / -1; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .row > label:first-child { color: var(--muted); min-width: 92px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); }
  input, select, button, textarea { font: inherit; color: var(--text); background: #0f1117; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=range] { padding: 0; flex: 1; accent-color: var(--accent); }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
  button { cursor: pointer; background: #222733; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1006; font-weight: 600; }
  button.ghost { background: transparent; }
  a { color: var(--blue); }
  ol { padding-left: 20px; margin: 8px 0; } ol li { margin: 6px 0; }
  code { background: #0f1117; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .ev { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev .when { color: var(--blue); min-width: 96px; font-variant-numeric: tabular-nums; }
  .ev.now .when { color: var(--accent); font-weight: 600; }
  .ev .cal { width: 4px; border-radius: 2px; flex: none; }
  .cals label, .chk label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .chk { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0 12px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 > * { min-width: 0; }
  .results button { display: block; width: 100%; text-align: left; margin: 4px 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222733; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Telas */
  .mode { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
  .mode label { display: flex; align-items: center; gap: 6px; }
  .screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; margin-top: 14px; }
  .scr { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #12151b; }
  .scr.active { border-color: var(--accent); }
  .scr .top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .scr .top input { flex: 1; min-width: 0; font-weight: 600; }
  .scr .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .scr .slots label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .scr .slots select { width: 100%; padding: 5px 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #1a1006; font-weight: 600; white-space: nowrap; }

  /* Previa da tela: mesmo layout do firmware (320x240) */
  .screen-wrap { display: flex; overflow-x: auto; }
  .screen-wrap > .screen { margin: 0 auto; }  /* margin auto: centraliza sem cortar a esquerda quando sobra pouco espaco */
  .screen { --k: 1.6; width: calc(320px * var(--k)); height: calc(240px * var(--k)); background: #0c0e12; border: 10px solid #2b2b2b; border-radius: 6px; font-family: "Consolas", monospace; color: #e8eaee; flex: none; overflow: hidden; font-size: calc(9.5px * var(--k)); box-sizing: content-box; }
  .screen.mini { --k: 0.95; border-width: 6px; }
  .screen .hdr { height: calc(28px * var(--k)); display: flex; align-items: center; padding: 0 calc(8px * var(--k)); border-bottom: 1px solid #2c323e; gap: 6px; }
  .screen .hdr .clock { margin-left: auto; font-size: calc(19px * var(--k)); }
  .screen .mid { display: grid; grid-template-columns: 1fr 1fr; height: calc(124px * var(--k)); }
  .screen .col { padding: calc(4px * var(--k)) calc(8px * var(--k)); position: relative; min-width: 0; }
  .screen .col + .col { border-left: 1px solid #2c323e; }
  .screen .t { color: #828a98; }
  .screen .spark { height: calc(34px * var(--k)); background: #222630; display: flex; align-items: flex-end; margin: 4px 0; }
  .screen .spark i { flex: 1; background: #6e3e16; border-top: 2px solid var(--accent); }
  .screen .bar { display: grid; grid-template-columns: 3.4em 1fr 2.8em; align-items: center; gap: 4px; margin: 3px 0; }
  .screen .bar .trk { height: calc(7px * var(--k)); background: #222630; border-radius: 4px; overflow: hidden; }
  .screen .bar .fill { height: 100%; display: block; }
  .screen .big { font-size: calc(24px * var(--k)); }
  .screen .hours { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 4px; }
  .screen .fx div { display: grid; grid-template-columns: 2.6em 1fr 3.6em; margin: calc(5px * var(--k)) 0; align-items: baseline; }
  .screen .fx b { font-weight: normal; font-size: 1.25em; }
  .screen .agenda { padding: calc(4px * var(--k)) calc(8px * var(--k)); border-top: 1px solid #2c323e; height: calc(88px * var(--k)); }
  .screen .agenda div { display: flex; gap: 10px; height: calc(16px * var(--k)); align-items: center; }
  .screen .agenda .w { color: var(--blue); width: 9em; flex: none; }
  .screen .agenda .now .w { color: var(--accent); }
  .screen .agenda span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Relogio de mesa (tipo "clock"): metade de cima relogio, metade de baixo animacao */
  .screen { position: relative; }
  .screen canvas.ov, .screen canvas.px { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .screen .scene { height: calc(240px * var(--k)); position: relative; overflow: hidden; }
  .sc-aquarium { background: linear-gradient(#0b3a5c, #062338); }
  .sc-aquarium u { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: #c2a46b; }
  .sc-aquarium i { position: absolute; font-style: normal; font-size: 1.6em; animation: swim 9s linear infinite; }
  .sc-aquarium i:nth-child(1) { top: 20%; } .sc-aquarium i:nth-child(2) { top: 45%; animation-duration: 13s; animation-delay: -4s; } .sc-aquarium i:nth-child(3) { top: 62%; animation-duration: 17s; animation-delay: -9s; }
  .sc-aquarium b { position: absolute; bottom: 10%; color: #9fd4ff; animation: bubble 4s linear infinite; left: 30%; } .sc-aquarium b + b { left: 72%; animation-delay: -2s; }
  @keyframes swim { from { left: -10%; } to { left: 105%; } }
  @keyframes bubble { from { bottom: 10%; opacity: 1; } to { bottom: 100%; opacity: 0; } }
  .sc-stars { background: #05070d; }
  .sc-stars s { position: absolute; width: 2px; height: 2px; background: #fff; animation: tw 2s ease-in-out infinite alternate; }
  .sc-stars em { position: absolute; right: 12%; top: 12%; color: #e8e2c0; font-style: normal; font-size: 2em; }
  @keyframes tw { from { opacity: .2; } to { opacity: 1; } }
  .sc-matrix { background: #010a03; }
  .sc-matrix p { position: absolute; top: -100%; margin: 0; color: #2bd96b; font-size: .9em; line-height: 1.05; animation: fall 3s linear infinite; text-shadow: 0 0 4px #2bd96b; }
  @keyframes fall { to { top: 100%; } }
  .sc-fire { background: linear-gradient(to top, #fff3b0 0%, #ffb02e 18%, #e2481c 40%, #5a0d06 70%, #0c0e12 100%); animation: flick .25s steps(2) infinite alternate; }
  @keyframes flick { to { filter: brightness(1.15) saturate(1.2); } }
  .sc-none { background: #0c0e12; }
  .sc-rain { background: linear-gradient(#060a16, #18263e 87%); }
  .sc-rain p { position: absolute; top: -12%; margin: 0; width: 1px; height: 9%; background: #8cbef5; opacity: .75; transform: rotate(16deg); animation: drop .7s linear infinite; }
  .sc-rain u { position: absolute; left: 0; right: 0; bottom: 0; height: 12%; background: #0e1a2c; border-top: 1px solid #1c2a44; }
  @keyframes drop { to { top: 88%; } }
  .sc-sunset { background: linear-gradient(#12062a 0%, #5a1466 30%, #ff6a46 59%, #0e041c 59%); }
  .sc-sunset em { position: absolute; left: 39%; top: 28%; width: 22%; height: 31%; border-radius: 999px 999px 0 0; background: linear-gradient(#ffe63c, #ff4f8c); -webkit-mask: repeating-linear-gradient(#000 0 14%, transparent 14% 18%); mask: repeating-linear-gradient(#000 0 14%, transparent 14% 18%); }
  .sc-sunset u { position: absolute; left: 0; right: 0; bottom: 0; height: 41%; border-top: 1px solid #00f0ff; background: repeating-linear-gradient(transparent 0 16%, #d7239b 16% 19%), repeating-linear-gradient(90deg, transparent 0 9%, #d7239b 9% 9.7%); animation: grid 1s linear infinite; }
  @keyframes grid { to { background-position: 0 20%, 0 0; } }
  .sc-snow { background: linear-gradient(#0a1222, #2c405e 89%); }
  .sc-snow s { position: absolute; top: -3%; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: flake 5s linear infinite; }
  .sc-snow u { position: absolute; left: 0; right: 0; bottom: 0; height: 11%; background: #d7e4f2; }
  @keyframes flake { to { top: 89%; transform: translateX(10px); } }
  .sc-aurora { background: #04081a; }
  .sc-aurora em { position: absolute; left: -10%; right: -10%; top: 14%; height: 30%; border-radius: 50%; background: linear-gradient(transparent, #18d29a99, #5a3cc055, transparent); filter: blur(6px); animation: aur 6s ease-in-out infinite alternate; }
  .sc-aurora em + em { top: 34%; animation-duration: 8s; animation-direction: alternate-reverse; opacity: .7; }
  .sc-aurora u { position: absolute; left: 0; right: 0; bottom: 0; height: 17%; background: #06101a; border-top: 1px solid #19464f; }
  @keyframes aur { to { transform: translateX(8%) skewX(-14deg); } }
  .scr .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 8px; font-size: 12px; }
  .scr .sizes label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .scr .sizes input { flex: 1; min-width: 0; }
  .scr .sizes span { min-width: 16px; text-align: right; color: var(--text); }
  .scr .opts { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 12px; }
  .scr .opts select { padding: 5px 6px; }
  .scr .opts input[type=color], .app input[type=color] { width: 34px; height: 28px; padding: 2px; }
  .apps { display: grid; gap: 6px; margin-bottom: 10px; }
  .app { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .app select, .app input { padding: 4px 6px; font-size: 12px; }
  .app .mv { margin-left: auto; display: flex; }
  .app .mv button { padding: 2px 7px; }
  @media (max-width: 640px) {
    main { padding: 12px; }
    .screen { --k: 1; }
    .screen.mini { --k: .8; }
    .screens { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Painel CYD</h1>
  <span class="pill"><span class="dot" id="p-board"></span><span id="p-board-t">Placa</span></span>
  <span class="pill"><span class="dot" id="p-pc"></span><span id="p-pc-t">PC</span></span>
  <span class="pill"><span class="dot" id="p-google"></span><span id="p-google-t">Google</span></span>
  <span class="pill"><span class="dot" id="p-weather"></span><span id="p-weather-t">Tempo</span></span>
</header>

<main>
  <section class="card wide">
    <h2>Na tela agora <span id="now-name" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="screen-wrap"><div class="screen" id="screen"></div></div>
  </section>

  <section class="card wide">
    <h2>Telas</h2>
    <div class="mode">
      <label><input type="radio" name="mode" value="auto"> Automatico</label>
      <label><input type="radio" name="mode" value="manual"> Manual</label>
    </div>
    <div id="mode-auto" class="row">
      <label>PC conectado</label><select id="pc-on"></select>
      <label style="min-width:0;margin-left:12px" class="muted">PC desconectado</label><select id="pc-off"></select>
    </div>
    <div id="mode-manual" class="row">
      <label>Exibir sempre</label><select id="manual"></select>
    </div>
    <p class="muted" style="margin:4px 0 0">"PC conectado" = o agente do PC mandou metricas nos ultimos <span id="pc-timeout"></span> s.</p>
    <div class="screens" id="screens"></div>
    <div class="row"><button id="scr-add">+ Nova tela</button><button class="primary" id="scr-save" style="display:none">Salvar telas</button><span id="scr-dirty" class="muted"></span></div>
  </section>

  <section class="card">
    <h2>Placa</h2>
    <div id="board-status" class="muted"></div>
    <div id="pc-status" class="muted" style="margin-top:6px"></div>
    <div class="row"><label>Brilho</label><input type="range" id="brightness" min="10" max="255"><span id="br-v" class="muted"></span></div>
    <div class="row"><label>Cores</label><label style="min-width:0"><input type="checkbox" id="invert"> inverter (se aparecer negativo)</label></div>
    <div class="row"><label>Rotacao</label><label style="min-width:0"><input type="checkbox" id="rotation"> girar 180°</label></div>
  </section>

  <section class="card">
    <h2>Tempo</h2>
    <div id="weather-now"></div>
    <div class="row"><label>Cidade</label><span id="city"></span></div>
    <form class="row" id="city-form"><input id="city-q" placeholder="Buscar outra cidade" style="flex:1"><button>Buscar</button></form>
    <div class="results" id="city-results"></div>
  </section>

  <section class="card">
    <h2>Cotacoes</h2>
    <div id="quotes-now"></div>
    <p class="muted" style="margin:12px 0 4px">Pares exibidos (ate 4):</p>
    <div class="chk" id="quote-pairs"></div>
  </section>

  <section class="card">
    <h2>Google Agenda</h2>
    <div id="google"></div>
  </section>

  <section class="card">
    <h2>Proximos compromissos</h2>
    <div id="events"></div>
    <form id="ev-form" style="margin-top:14px;display:none">
      <h2 style="margin-top:8px">Novo evento</h2>
      <div class="row"><input id="ev-title" placeholder="Titulo" style="flex:1" required></div>
      <div class="grid2">
        <input type="date" id="ev-date" required>
        <input type="time" id="ev-time" title="Vazio = dia inteiro">
        <select id="ev-min"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="90">1h30</option><option value="120">2 horas</option></select>
        <select id="ev-cal"></select>
      </div>
      <div class="row"><button class="primary">Adicionar</button><span class="muted">Sem horario = dia inteiro</span></div>
    </form>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let S = null, calendars = null, settingsLoaded = false;
let draft = null, dirty = false;   // copia editavel das telas

const WIDGETS_HALF = { sys: "Sistema do PC", w: "Tempo", fx: "Cotacoes", none: "(vazio)" };
const WIDGETS_BOTTOM = { ev: "Agenda", none: "(vazio)" };
const KINDS = { grid: "Regioes (widgets)", clock: "Relogio de mesa", pixel: "Relogio pixel (LEDs)" };
const APP_TYPES = { clock: "Hora", date: "Data", weather: "Tempo", quote: "Cotacao", event: "Prox. compromisso", cpu: "CPU do PC", text: "Texto livre" };
const TRANS = { slide: "Deslizar", none: "Corte seco" };
const SCENES = { aquarium: "Aquario", stars: "Ceu estrelado", matrix: "Chuva Matrix", fire: "Fogo", rain: "Noite de chuva", sunset: "Synthwave", snow: "Nevasca", aurora: "Aurora boreal", none: "Sem animacao" };
const FONTS = { pixel: "Pixel", dots: "LED redondo", segment: "7 segmentos", arcade: "Arcade 5x7", clean: "Lisa 5x7" };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}
async function api(path, opts = {}) {
  // location.origin: funciona mesmo se a pagina foi aberta como http://usuario:senha@host
  const r = await fetch(location.origin + path, { credentials: "include", ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const ago = (ts) => {
  if (!ts) return "nunca";
  const s = Math.round(S.now - ts);
  return s < 60 ? `ha ${s}s` : s < 3600 ? `ha ${Math.round(s / 60)} min` : `ha ${Math.round(s / 3600)} h`;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pctColor = (p) => (p < 60 ? "var(--good)" : p < 85 ? "var(--warn)" : "var(--bad)");
const ICON = { S: "☀", P: "⛅", C: "☁", F: "🌫", R: "🌧", T: "⛈", N: "❄" };
const cpuHist = [];

function setDot(id, cls, text) { $(id).className = "dot " + cls; $(id + "-t").textContent = text; }

// ---------- previa da tela (espelha o firmware) ----------
function widget(kind, p) {
  if (kind === "sys") {
    const s = p.sys;
    if (!s) return `<div class="t">SISTEMA</div><div class="t" style="margin-top:1.5em">PC desconectado</div>`;
    const bar = (lbl, v, val) => `<div class="bar"><span class="t">${lbl}</span><span class="trk"><span class="fill" style="width:${v}%;background:${pctColor(v)}"></span></span><span>${val}</span></div>`;
    const rate = (k) => (k >= 1024 ? (k / 1024).toFixed(1) + " MB/s" : Math.round(k) + " KB/s");
    return `<div style="display:flex"><span class="t">SISTEMA</span><span style="margin-left:auto">CPU ${Math.round(s.cpu)}%</span></div>
      <div class="spark">${cpuHist.map((v) => `<i style="height:${Math.max(2, v)}%"></i>`).join("")}</div>
      ${bar("RAM", s.ram, Math.round(s.ram) + "%")}${bar("DISCO", s.dsk, Math.round(s.dsk) + "%")}
      <div style="font-size:.85em;margin-top:3px"><span style="color:var(--good)">▼</span> ${rate(s.dn)} &nbsp;<span style="color:var(--blue)">▲</span> ${rate(s.up)}</div>`;
  }
  if (kind === "w") {
    const w = p.w;
    if (!w.ok) return `<div class="t">${esc(w.city)}</div><div class="t" style="margin-top:1.5em">sem previsao</div>`;
    return `<div class="t">${esc(w.city)}</div>
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:2.4em">${ICON[w.ic] || ""}</span>
      <div><div class="big">${w.tc}°C</div><div class="t">${w.mn}° / ${w.mx}°</div></div></div>
      <div class="hours">${w.h.map((h) => `<div><div class="t">${h[0]}</div><div>${ICON[h[2]] || ""}</div><div>${h[1]}°</div></div>`).join("")}</div>`;
  }
  if (kind === "fx") {
    const f = p.fx;
    if (!f.ok) return `<div class="t">COTACOES</div><div class="t" style="margin-top:1.5em">${esc(f.msg)}</div>`;
    return `<div style="display:flex"><span class="t">COTACOES</span><span class="t" style="margin-left:auto">${esc(f.at)}</span></div>
      <div class="fx">${f.l.map((q) => `<div><span class="t">${esc(q[0])}</span><b>${esc(q[1])}</b><span style="text-align:right;color:${q[2] >= 0 ? "var(--good)" : "var(--bad)"}">${q[2] >= 0 ? "+" : ""}${q[2].toFixed(1)}%</span></div>`).join("")}</div>`;
  }
  return "";
}
// ================= pixel: mesma fonte 3x5, icones e regras do firmware =================
let PX = null;  // {font:{ch:[bits,w]}, icons:{nome:[64 cores|null]}}
const c565 = (v) => { const r = (v >> 11) << 3, g = ((v >> 5) & 63) << 2, b = (v & 31) << 3; return `rgb(${r},${g},${b})`; };
function pxWidth(t) {
  let w = 0;
  for (const ch of t) w += (PX.font[ch] || PX.font[" "])[1] + 1;

          <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="seconds" ${s.seconds !== false ? "checked" : ""}> segundos</label>
        </div>
        <div class="sizes">
          ${[["csize", "Hora", 4, 18, 12], ["dsize", "Data", 0, 8, 3], ["wsize", "Tempo", 0, 8, 3], ["esize", "Agenda", 0, 8, 3]].map(([f, lbl, mn, mx, df]) =>
            `<label>${lbl}<input type="range" data-f="${f}" min="${mn}" max="${mx}" value="${s[f] ?? df}"><span data-v="${f}">${s[f] ?? df}</span></label>`).join("")}
        </div>
        <div class="opts muted">Arraste os itens na previa para posiciona-los · tamanho 0 esconde o item
          <button class="ghost" data-center title="Volta a centralizar a hora">Centralizar hora</button>
          <button class="ghost" data-resetpos>Posicoes padrao</button>
        </div>` : (s.kind || "grid") === "pixel" ? `
        <div class="opts"><span class="muted">Transicao</span><select data-f="trans">${opts(TRANS, s.trans || "slide")}</select>
          <span class="muted">Apps alternam na ordem abaixo</span></div>
        <div class="apps">${(s.apps || []).map((a, j) => `
          <div class="app" data-j="${j}">
            <select data-a="type" data-rebuild>${opts(APP_TYPES, a.type)}</select>
            <select data-a="icon" title="Icone">${opts({ auto: "icone auto", none: "sem icone", ...Object.fromEntries(Object.keys(PX?.icons || {}).map((k) => [k, k])) }, a.icon || "auto")}</select>
            <input type="color" data-a="color" value="${esc(a.color || "#ffffff")}" title="Cor do texto">
            <input type="number" data-a="dur" min="2" max="60" value="${+a.dur || 6}" title="Segundos na tela" style="width:56px">
            ${a.type === "text" ? `<input data-a="text" value="${esc(a.text || "")}" maxlength="60" placeholder="Texto" style="flex:1;min-width:90px">` : ""}
            ${a.type === "quote" ? `<select data-a="pair">${opts(Object.fromEntries((S.quote_pairs || []).map((x) => [x, x.replace("-BRL", "")])), a.pair || "USD-BRL")}</select>` : ""}
            <span class="mv"><button class="ghost" data-mv="-1" title="Subir">↑</button><button class="ghost" data-mv="1" title="Descer">↓</button><button class="ghost" data-rm title="Remover">✕</button></span>
          </div>`).join("")}
          <button data-addapp ${(s.apps || []).length >= 8 ? "disabled" : ""}>+ App</button>
        </div>` : `
        <div class="slots">
          <div><label>Esquerda</label><select data-f="left">${opts(WIDGETS_HALF, s.left)}</select></div>
          <div><label>Direita</label><select data-f="right">${opts(WIDGETS_HALF, s.right)}</select></div>
          <div><label>Embaixo</label><select data-f="bottom">${opts(WIDGETS_BOTTOM, s.bottom)}</select></div>
        </div>`}
        <div class="screen-wrap"><div class="screen mini" data-prev></div></div>
      </div>`).join("");
    box.querySelectorAll(".scr").forEach((el) => {
      const i = +el.dataset.i;
      el.querySelectorAll("[data-f]").forEach((inp) => {
        inp.oninput = () => {
          draft[i][inp.dataset.f] = inp.type === "checkbox" ? inp.checked : inp.type === "range" ? +inp.value : inp.value;
          const v = el.querySelector(`[data-v="${inp.dataset.f}"]`); if (v) v.textContent = inp.value;
          markDirty();
          // trocar o tipo muda os campos do cartao: redesenha
          if ("rebuild" in inp.dataset) { box.innerHTML = ""; renderScreens(); } else paintPreviews();
        };
      });
      // ---- apps do relogio pixel ----
      const rebuild = () => { markDirty(); box.innerHTML = ""; renderScreens(); };
      el.querySelectorAll(".app").forEach((row) => {
        const j = +row.dataset.j, app = draft[i].apps[j];
        row.querySelectorAll("[data-a]").forEach((inp) => {
          inp.oninput = () => {
            app[inp.dataset.a] = inp.type === "number" ? +inp.value : inp.value;
            if ("rebuild" in inp.dataset) rebuild(); else { markDirty(); paintPreviews(); }
          };
        });
        row.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => {
          const k = j + +b.dataset.mv, arr = draft[i].apps;
          if (k < 0 || k >= arr.length) return;
          [arr[j], arr[k]] = [arr[k], arr[j]]; rebuild();
        }));
        row.querySelector("[data-rm]").onclick = () => { draft[i].apps.splice(j, 1); rebuild(); };
      });
      const add = el.querySelector("[data-addapp]");
      const ctr = el.querySelector("[data-center]");
      if (ctr) ctr.onclick = () => { draft[i].cx = -1; markDirty(); paintPreviews(); };
      const rst = el.querySelector("[data-resetpos]");
      if (rst) rst.onclick = () => {
        Object.assign(draft[i], { cx: -1, cy: 14, dx: 12, dy: 88, wx: 238, wy: 88, ex: 12, ey: 110 });
        markDirty(); paintPreviews();
      };
      if (add) add.onclick = () => {
        draft[i].apps = draft[i].apps || [];
        draft[i].apps.push({ type: "text", icon: "auto", color: "#ffffff", dur: 6, text: "OLA", pair: "USD-BRL" });
        rebuild();
      };
      el.querySelector("[data-del]").onclick = () => {
        if (draft.length === 1) return toast("Precisa existir pelo menos uma tela");
        if (!confirm(`Apagar a tela "${draft[i].name}"?`)) return;
        draft.splice(i, 1); markDirty(); box.innerHTML = ""; renderScreens();
      };
    });
  }
  paintPreviews();
}
function paintPreviews() {
  document.querySelectorAll("#screens .scr").forEach((el) => {
    const s = draft[+el.dataset.i];
    // monta a previa com os dados reais e o layout em edicao
    const base = Object.values(S.payloads)[0];
    const p = { ...base, sys: S.pc.online ? S.sys : null, w: S.payloads[Object.keys(S.payloads).find((k) => S.payloads[k].w)]?.w || { ok: 0, city: "" },
      fx: Object.values(S.payloads).find((x) => x.fx)?.fx || fxLocal(), ev: Object.values(S.payloads).find((x) => x.ev)?.ev || { st: "off", l: [] },
      lay: s.kind === "clock" ? { f: "clock", sc: s.scene || "aquarium", sec: s.seconds !== false ? 1 : 0, col: hex565(s.color || "#ffd23c"),
          fn: FONT_ID[s.font] ?? 0, cs: s.csize ?? 12, cx: s.cx ?? -1, cy: s.cy ?? 14, ds: s.dsize ?? 3, dx: s.dx ?? 12, dy: s.dy ?? 88,
          ws: s.wsize ?? 3, wx: s.wx ?? 238, wy: s.wy ?? 88, es: s.esize ?? 3, ex: s.ex ?? 12, ey: s.ey ?? 110 }
        : s.kind === "pixel" ? { f: "pixel", tr: s.trans || "slide", a: PX ? appsLocal(s) : [] }
        : { l: s.left, r: s.right, b: s.bottom } };
    const cv = renderScreen(el.querySelector("[data-prev]"), p, false);
    if (s.kind === "clock" && cv) enableDrag(cv, +el.dataset.i);
    el.classList.toggle("active", s.id === S.active);
    el.querySelector("[data-badge]").style.display = s.id === S.active ? "" : "none";
  });
}
function fxLocal() {
  if (!S.quotes.length) return { ok: 0, msg: "buscando..." };
  return { ok: 1, at: "", l: S.quotes.map((q) => [q.lbl, fmtBRL(q.bid), q.ch]) };
}
function hex565(h) {
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3) || 1;
}
// Mesmo criterio do servidor (quotes.fmt_brl): grandes sem centavos, pequenos com 2-3 casas.
function fmtBRL(v) {
  const dec = v >= 1000 ? 0 : v >= 1 ? 2 : 3;
  return v.toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
$("scr-add").onclick = () => {
  const name = prompt("Nome da nova tela:", "Nova tela"); if (!name) return;
  draft.push({ id: slug(name), name, kind: "grid", left: "w", right: "fx", bottom: "ev", scene: "aquarium", seconds: true, color: "#ffd23c",
    trans: "slide", apps: [{ type: "clock", icon: "auto", color: "#ffffff", dur: 10 }, { type: "weather", icon: "auto", color: "#ffd23c", dur: 5 }] });
  markDirty(); $("screens").innerHTML = ""; renderScreens();
};
$("scr-save").onclick = async () => {
  try {
    await post("/api/config", { screens: draft });
    // telas apagadas: o modo precisa apontar para uma que existe
    const ids = draft.map((s) => s.id), d = { ...S.config.display };
    for (const k of ["pc_on", "pc_off", "manual"]) if (!ids.includes(d[k])) d[k] = ids[0];
    await post("/api/config", { display: d });
    dirty = false; $("scr-save").style.display = "none"; $("scr-dirty").textContent = ""; $("screens").innerHTML = "";
    toast("Telas salvas"); refresh();
  } catch (e) { toast(e.message); }
};
const saveDisplay = (patch) => post("/api/config", { display: { ...S.config.display, ...patch } }).then(() => { toast("Exibicao alterada"); refresh(); });
document.querySelectorAll("input[name=mode]").forEach((r) => (r.onchange = () => saveDisplay({ mode: r.value })));
$("pc-on").onchange = () => saveDisplay({ pc_on: $("pc-on").value });
$("pc-off").onchange = () => saveDisplay({ pc_off: $("pc-off").value });
$("manual").onchange = () => saveDisplay({ manual: $("manual").value });

// ---------- placa / pc ----------
function renderBoard() {
  const D = S.device, c = S.config, P = S.pc;
  const alive = D.at && S.now - D.at < 5;
  $("board-status").innerHTML = alive
    ? `Placa buscando dados de <b>${esc(D.ip)}</b> · ultima ${ago(D.at)}`
    : `<span class="err">Placa sem contato ${D.at ? ago(D.at) : "(nunca conectou)"}.</span> Confira o Wi-Fi e o endereco/token gravados nela.`;
  $("pc-status").innerHTML = P.online
    ? `PC conectado: ${esc(P.agent?.host || "")} (${esc(P.agent?.ip || "")}) · metricas ${ago(P.at)}`
    : `PC desconectado${P.at ? " · ultimo envio " + ago(P.at) : ""}. Rode o agente (<code>agente/</code>) no PC.`;
  setDot("p-board", alive ? "good" : "bad", alive ? "Placa: online" : "Placa: offline");
  setDot("p-pc", P.online ? "good" : "", P.online ? "PC: conectado" : "PC: desconectado");
  if (!settingsLoaded) {
    $("brightness").value = c.brightness; $("br-v").textContent = c.brightness;
    $("invert").checked = !!c.invert; $("rotation").checked = c.rotation === 3;
  }
}
$("brightness").oninput = () => { $("br-v").textContent = $("brightness").value; };
$("brightness").onchange = () => post("/api/config", { brightness: +$("brightness").value });
$("invert").onchange = () => post("/api/config", { invert: $("invert").checked ? 1 : 0 });
$("rotation").onchange = () => post("/api/config", { rotation: $("rotation").checked ? 3 : 1 });

// ---------- tempo ----------
function renderWeather() {
  const w = S.weather, c = S.config.city;
  $("city").textContent = `${c.name}${c.admin ? " — " + c.admin : ""}`;
  if (w) {
    $("weather-now").innerHTML = `<div style="font-size:28px">${ICON[w.ic] || ""} ${w.tc}°C <span class="muted" style="font-size:14px">${esc(w.desc)}, umidade ${w.hum ?? "?"}%</span></div>
      <div class="muted">Hoje ${w.mn}° a ${w.mx}° · atualizado ${ago(S.weather_at)}</div>`;
  } else $("weather-now").innerHTML = `<span class="${S.weather_err ? "err" : "muted"}">${esc(S.weather_err || "Buscando previsao...")}</span>`;
  setDot("p-weather", w && !S.weather_err ? "good" : S.weather_err ? "bad" : "", w ? `Tempo: ${w.tc}°C` : "Tempo");
}
$("city-form").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("city-q").value.trim(); if (!q) return;
  try {
    const rs = await api("/api/geocode?q=" + encodeURIComponent(q));
    $("city-results").innerHTML = rs.length ? "" : '<span class="muted">Nada encontrado</span>';
    rs.forEach((r) => {
      const b = document.createElement("button");
      b.textContent = `${r.name} — ${r.admin}, ${r.country}`;
      b.onclick = async () => {
        await post("/api/config", { city: { name: r.name, admin: r.admin, lat: r.lat, lon: r.lon } });
        $("city-results").innerHTML = ""; $("city-q").value = ""; toast("Cidade alterada"); refresh();
      };
      $("city-results").appendChild(b);
    });
  } catch (err) { toast(err.message); }
};

// ---------- cotacoes ----------
function renderQuotes() {
  $("quotes-now").innerHTML = S.quotes.length
    ? S.quotes.map((q) => `<div class="row" style="margin:4px 0"><span style="min-width:48px" class="muted">${esc(q.lbl)}</span>
        <b>R$ ${fmtBRL(q.bid)}</b>
        <span style="color:${q.ch >= 0 ? "var(--good)" : "var(--bad)"}">${q.ch >= 0 ? "+" : ""}${q.ch.toFixed(2)}%</span></div>`).join("")
      + `<div class="muted">atualizado ${ago(S.quotes_at)} · AwesomeAPI</div>`
    : `<span class="${S.quotes_err ? "err" : "muted"}">${esc(S.quotes_err || "Buscando cotacoes...")}</span>`;
  if (!$("quote-pairs").children.length) {
    $("quote-pairs").innerHTML = S.quote_pairs.map((p) => `<label><input type="checkbox" value="${p}" ${S.config.quotes.includes(p) ? "checked" : ""}>${p.replace("-BRL", "")}</label>`).join("");
    $("quote-pairs").querySelectorAll("input").forEach((i) => (i.onchange = async () => {
      const sel = [...$("quote-pairs").querySelectorAll("input:checked")].map((x) => x.value);
      if (sel.length > 4) { i.checked = false; return toast("No maximo 4 pares"); }
      await post("/api/config", { quotes: sel }); toast("Cotacoes atualizadas"); setTimeout(refresh, 1500);
    }));
  }
}

// ---------- google ----------
function renderGoogle() {
  const g = S.google, box = $("google");
  setDot("p-google", g.status === "ok" ? "good" : g.status === "err" ? "bad" : "", g.status === "ok" ? "Google: conectado" : g.status === "err" ? "Google: erro" : "Google: desligado");
  $("ev-form").style.display = g.status === "ok" ? "" : "none";

  const connectBlock = `
    <ol>
      <li><a href="/auth/google" target="_blank">Abrir o login do Google</a> e autorizar (o aviso "app nao verificado" e esperado: e o seu proprio app).</li>
      <li>No fim, o navegador vai para <code>http://localhost:8765/oauth/callback?...</code> e mostra erro de conexao. <b>Isso e normal.</b></li>
      <li>Copie o endereco inteiro da barra e cole aqui:</li>
    </ol>
    <div class="row"><input id="g-url" placeholder="http://localhost:8765/oauth/callback?state=...&code=..." style="flex:1"><button class="primary" id="g-finish">Concluir</button></div>
    <p class="muted" style="margin-bottom:4px">Ou envie o <code>token.json</code> que o programa antigo gerou no PC (pasta <code>data/</code>):</p>
    <div class="row"><input type="file" id="g-token" accept=".json"><button id="g-token-up">Enviar token</button></div>`;
  const wireConnect = () => {
    $("g-finish").onclick = async () => {
      try { await post("/api/google/finish", { url: $("g-url").value }); toast("Google conectado!"); box.dataset.mode = ""; refresh(); }
      catch (e) { toast(e.message); }
    };
    $("g-token-up").onclick = async () => {
      const f = $("g-token").files[0]; if (!f) return toast("Escolha o token.json");
      const fd = new FormData(); fd.append("file", f);
      try { await api("/api/google/token", { method: "POST", body: fd }); toast("Token enviado"); box.dataset.mode = ""; setTimeout(refresh, 1500); }
      catch (e) { toast(e.message); }
    };
  };

  if (!g.has_secret) {
    if (box.dataset.mode === "setup") return;
    box.dataset.mode = "setup";
    box.innerHTML = `<p>Envie a credencial de app do Google (<code>client_secret.json</code>, tipo <b>App para computador</b>). Passo a passo em <code>docs/google-agenda.md</code>.</p>
      <div class="row"><input type="file" id="secret" accept=".json"><button class="primary" id="secret-up">Enviar</button></div>`;
    $("secret-up").onclick = async () => {
      const f = $("secret").files[0]; if (!f) return toast("Escolha o arquivo JSON");
      const fd = new FormData(); fd.append("file", f);
      try { await api("/api/google/secret", { method: "POST", body: fd }); toast("Credencial salva"); box.dataset.mode = ""; refresh(); }
      catch (e) { toast(e.message); }
    };
    return;
  }
  if (!g.connected) {
    if (box.dataset.mode === "connect") return;
    box.dataset.mode = "connect";
    box.innerHTML = `<p>Credencial pronta. Falta entrar com a sua conta:</p>${connectBlock}`;
    wireConnect();
    return;
  }
  const mode = "connected:" + g.status + ":" + (g.account || "");
  if (box.dataset.mode !== mode) {
    box.dataset.mode = mode;
    box.innerHTML = `${g.status === "err" ? `<p class="err">${esc(g.error)}</p>${connectBlock}` : ""}
      ${g.account ? `<p>Conectado como <b>${esc(g.account)}</b></p>` : ""}
      <h2 style="margin-top:16px">Agendas exibidas na tela</h2><div class="cals" id="cals"><span class="muted">Carregando...</span></div>
      <div class="row"><button id="g-refresh">Atualizar agora</button><button id="g-off">Desconectar</button></div>`;
    if (g.status === "err") wireConnect();
    $("g-off").onclick = async () => { if (!confirm("Desconectar a conta Google?")) return; await post("/api/google/disconnect", {}); calendars = null; box.dataset.mode = ""; refresh(); };
    $("g-refresh").onclick = async () => { await post("/api/refresh", {}); toast("Atualizando..."); setTimeout(refresh, 1500); };
    if (g.status === "ok") loadCalendars();
  }
}
async function loadCalendars() {
  try { calendars = await api("/api/calendars"); } catch (e) { $("cals").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  const sel = new Set(S.config.calendars.map((id) => (id === "primary" ? calendars.find((c) => c.primary)?.id : id)));
  $("cals").innerHTML = calendars.map((c) => `<label><input type="checkbox" value="${esc(c.id)}" ${sel.has(c.id) ? "checked" : ""}><span class="swatch" style="background:${esc(c.color)}"></span>${esc(c.name)}</label>`).join("");
  $("cals").querySelectorAll("input").forEach((i) => (i.onchange = async () => {
    const ids = [...$("cals").querySelectorAll("input:checked")].map((x) => x.value);
    await post("/api/config", { calendars: ids }); toast("Agendas atualizadas"); setTimeout(refresh, 1500);
  }));
  const w = calendars.filter((c) => c.writable);
  $("ev-cal").innerHTML = w.map((c) => `<option value="${esc(c.id)}" ${c.primary ? "selected" : ""}>${esc(c.name)}</option>`).join("");
}

// ---------- eventos ----------
function renderEvents() {
  const g = S.google;
  if (g.status !== "ok") { $("events").innerHTML = `<span class="muted">Conecte o Google Agenda para ver os compromissos.</span>`; return; }
  if (!S.events.length) { $("events").innerHTML = `<span class="muted">Nada nos proximos ${S.config.days_ahead} dias.</span>`; return; }
  const color = (id) => calendars?.find((c) => c.id === id)?.color || "var(--line)";
  $("events").innerHTML = S.events.slice(0, 12).map((e) => `<div class="ev ${e.now ? "now" : ""}"><span class="cal" style="background:${esc(color(e.cal))}"></span>
    <span class="when">${esc(e.label)}</span><a href="${esc(e.link)}" target="_blank" style="color:inherit;text-decoration:none">${esc(e.title)}</a></div>`).join("")
    + `<p class="muted" style="margin:8px 0 0">A tela mostra os 4 primeiros · atualizado ${ago(g.updated_at)}</p>`;
}
$("ev-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await post("/api/events", { title: $("ev-title").value, date: $("ev-date").value, time: $("ev-time").value, minutes: +$("ev-min").value, calendar: $("ev-cal").value });
    $("ev-title").value = ""; toast("Evento criado"); setTimeout(refresh, 1500);
  } catch (err) { toast(err.message); }
};
$("ev-date").valueAsDate = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);

// ---------- loop ----------
async function refresh() {
  try { S = await api("/api/state"); } catch { setDot("p-board", "bad", "Servidor fora do ar"); return; }
  if (S.sys && S.pc.online) { cpuHist.push(S.sys.cpu); if (cpuHist.length > 72) cpuHist.shift(); }
  const act = S.config.screens.find((s) => s.id === S.active);
  $("now-name").textContent = act ? `· ${act.name} (${S.config.display.mode === "auto" ? "automatico" : "manual"})` : "";
  renderScreen($("screen"), S.payloads[S.active], true);
  renderScreens(); renderBoard(); renderWeather(); renderQuotes(); renderGoogle(); renderEvents();
  settingsLoaded = true;
}
api("/api/pixel_assets").then((j) => { PX = j; $("screens").innerHTML = ""; if (S) renderScreens(); }).catch(() => {});
refresh(); setInterval(refresh, 2000);
</script>
</body>
