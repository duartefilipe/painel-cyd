; Firmware do painel na CYD (ESP32-2432S028, tela ILI9341 320x240).
; A placa busca a tela no servidor por Wi-Fi; o USB so alimenta (e grava).
; Gravar pelo USB:   pio run -t upload
; Gravar pelo Wi-Fi: defina CYD_IP e PAINEL_TOKEN no ambiente e rode
;                    pio run -e cyd-ota -t upload
; Monitor:           pio device monitor

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Duas particoes de app de 1,9 MB (OTA) no lugar de 1,25 MB. A NVS (Wi-Fi e token)
; fica no mesmo endereco, entao trocar a tabela nao apaga a configuracao.
; A PRIMEIRA gravacao com esta tabela tem que ser pelo USB.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
    ; toque XPT2046 (v1.4 tem begin(SPIClass&): o toque da CYD fica num SPI separado da tela)
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; A TFT_eSPI normalmente se configura editando User_Setup.h dentro da biblioteca.
; Aqui vai tudo por flag, para o projeto compilar igual em qualquer máquina.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Atualizacao pelo Wi-Fi. A senha do OTA e o PAINEL_TOKEN gravado na placa.
[env:cyd-ota]
extends = env:cyd
upload_protocol = espota
upload_port = ${sysenv.CYD_IP}
upload_flags = --auth=${sysenv.PAINEL_TOKEN}
